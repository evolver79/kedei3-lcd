# Render into the vc4 fbdev framebuffer that kedei3-lcd mirrors to the LCD.
# The explicit layout keeps other Device sections from being attached as GPU
# devices.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection

Section "ServerLayout"
    Identifier "kedei"
    Screen "kedei"
EndSection

Section "Device"
    Identifier "kedei"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "kedei"
    Device "kedei"
EndSection
